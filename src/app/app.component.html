<mat-toolbar class="toolbar">
    <button mat-icon-button aria-label="Menu icon" (click)="toggleMenu()">
        <mat-icon>menu</mat-icon>
    </button>
   <a routerLink="home" > <h1 class="cursor-pointer">START FRAMEWORK</h1></a>
  </mat-toolbar>
  <mat-sidenav-container autosize>
    <mat-sidenav [ngClass]="!isCollapsed ? 'expanded' : ''" [mode]="isMobile ? 'over' : 'side'" [opened]="isMobile ? 'false' : 'true'">
        <mat-nav-list>
        <a mat-list-item class="link" *ngFor="let page of routePage" [routerLink]="page.path"  [routerLinkActive]="'active'" >
            <span class="entry">
              <!-- <mat-icon [svgIcon]="page.icon"></mat-icon> -->
               <mat-icon>{{page.icon}}</mat-icon>
               <span *ngIf="!isCollapsed">{{page.label}}</span>
            </span>
         </a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>

      <router-outlet></router-outlet>
      <app-footer class="w-full"></app-footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
